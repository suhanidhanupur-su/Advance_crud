<!DOCTYPE html>
<html>
<head>
    <title>Email Status</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f4f4f4;
        }

        .box{
            width: 40%;
            margin: 100px auto;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2{
            color: green;
        }

        a{
            text-decoration: none;
            background: blue;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>{{ message }}</h2>

        <br>

        <a href="{% url 'student_list' %}">
            Back To Student List
        </a>

    </div>

</body>
</html>
